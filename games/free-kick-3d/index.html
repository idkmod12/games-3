<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>3D Free Kick</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07130c;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:#0009;color:#d8ffe2;font-size:13px;pointer-events:none;white-space:nowrap}</style></head><body><canvas id="game"></canvas><div id="hint">Swipe toward the goal to shoot · Arrow keys also work</div><script>
(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),hint=document.getElementById('hint');let W,H,dpr,started=false,score=0,best=+(localStorage.getItem('free-kick-best')||0),shot=null,down=null,last=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function draw(){const t=performance.now();if(shot){shot.p=Math.min(1,(t-shot.t)/900);if(shot.p>=1){score+=shot.goal?1:0;best=Math.max(best,score);localStorage.setItem('free-kick-best',best);shot=null;hint.textContent=score?'Goal! Swipe again for the next shot':'Try another shot';}}x.clearRect(0,0,W,H);const sky=x.createLinearGradient(0,0,0,H*.62);sky.addColorStop(0,'#132f45');sky.addColorStop(1,'#4f9b9d');x.fillStyle=sky;x.fillRect(0,0,W,H);x.fillStyle='#247b43';x.fillRect(0,H*.5,W,H*.5);for(let i=0;i<12;i++){x.fillStyle=i%2?'#2c8a49':'#318f4e';x.fillRect(i*W/12,H*.5,W/24,H*.5)}const gw=Math.min(W*.64,560),gh=Math.min(H*.27,220),gx=(W-gw)/2,gy=H*.2;x.strokeStyle='#fff';x.lineWidth=6;x.strokeRect(gx,gy,gw,gh);x.lineWidth=1;x.strokeStyle='#ffffff66';for(let i=1;i<10;i++){x.beginPath();x.moveTo(gx+gw*i/10,gy);x.lineTo(gx+gw*i/10,gy+gh);x.stroke()}for(let i=1;i<5;i++){x.beginPath();x.moveTo(gx,gy+gh*i/5);x.lineTo(gx+gw,gy+gh*i/5);x.stroke()}x.fillStyle='#fff';x.font='700 18px system-ui';x.textAlign='left';x.fillText('SCORE '+score,18,32);x.textAlign='right';x.fillText('BEST '+best,W-18,32);if(!started){x.fillStyle='#0008';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#fff';x.font='800 clamp(30px,7vw,62px) system-ui';x.fillText('3D FREE KICK',W/2,H*.4);x.font='500 17px system-ui';x.fillText('Tap or swipe to shoot',W/2,H*.47);x.fillStyle='#ffbd3e';x.fillRect(W/2-86,H*.54,172,54);x.fillStyle='#16120a';x.font='800 18px system-ui';x.fillText('PLAY',W/2,H*.54+34)}else{const baseY=H*.82;let bx=W/2,by=baseY;if(shot){const q=shot.p, ease=q*q*(3-2*q);bx=shot.sx+(shot.tx-shot.sx)*ease;by=baseY-(baseY-shot.ty)*ease;const r=18-10*ease;x.fillStyle='#fff';x.beginPath();x.arc(bx,by,r,0,Math.PI*2);x.fill();x.strokeStyle='#111';x.lineWidth=2;x.stroke()}else{x.fillStyle='#fff';x.beginPath();x.arc(bx,by,18,0,Math.PI*2);x.fill();x.strokeStyle='#111';x.stroke()}if(shot&&shot.p>.7){x.fillStyle=shot.goal?'#71f58b':'#ff7a7a';x.font='900 28px system-ui';x.textAlign='center';x.fillText(shot.goal?'GOAL!':'SAVED',W/2,H*.72)}}last=t;requestAnimationFrame(draw)}
function shoot(ex,ey){if(!started){started=true;hint.textContent='Swipe toward the goal to shoot';return}if(shot)return;const sx=W/2,sy=H*.82,dx=ex-sx,dy=ey-sy;const tx=Math.max(W*.18,Math.min(W*.82,sx+dx*1.7)),ty=Math.max(H*.23,Math.min(H*.45,sy+dy*1.7));shot={sx,sy,tx,ty,t:performance.now(),p:0,goal:Math.abs(tx-W/2)<W*.28&&ty<H*.39};}
c.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointerup',e=>{if(down){const dx=e.clientX-down.x,dy=e.clientY-down.y;shoot(Math.abs(dx)+Math.abs(dy)>12?e.clientX:W/2,e.clientY);down=null}});addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key)){e.preventDefault();shoot(W/2+(e.key==='ArrowLeft'?-W*.2:e.key==='ArrowRight'?W*.2:0),e.key==='ArrowUp'?H*.25:H*.45)}});draw()})();</script></body></html>
